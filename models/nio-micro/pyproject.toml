[project]
name = "nio-micro"
version = "0.3.0"
description = "NioMicro — 5M Micro Decision LM (Multi-Head Classifier)"
authors = [{ name = "Nio Labs", email = "engineering@nio-labs.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6.0",
    "onnx>=1.15.0",
    "onnxscript>=0.3.0",
    "onnxruntime>=1.17.0",
    "tokenizers>=0.19.0",
    "transformers>=4.40.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
