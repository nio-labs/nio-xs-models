[project]
name = "nio-mask"
version = "0.1.0"
description = "NioMask — ~1.0M Real-Time Secret, Token & PII Stream Redactor"
authors = [{ name = "Nio Labs", email = "engineering@nio-labs.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
    "tokenizers>=0.19.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
