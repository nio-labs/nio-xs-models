[workspace]
members = [
    "crates/nio-cuda-runtime",
    "crates/nio-manta-runtime",
    "crates/nio-mask-runtime",
    "crates/nio-micro-runtime",
    "crates/nio-mini-runtime",
    "crates/nio-nano-runtime",
    "crates/nio-ray-runtime",
    "crates/nio-viper-runtime",
    "crates/nio-mako-runtime",
    "crates/nio-mcp",
    "crates/nioxs-cli",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

