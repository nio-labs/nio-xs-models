[package]
name = "nio-cuda-runtime"
version = "0.1.0"
edition = "2021"
description = "Official native Rust tactical swarm conductor runtime for NioCuda (~310M)"
license = "BUSL-1.1"

[dependencies]
nio-ray-runtime = { path = "../nio-ray-runtime" }
anyhow = "1.0"
tokenizers = { version = "=0.21.4", default-features = false, features = ["onig"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
