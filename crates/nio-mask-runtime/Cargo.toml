[package]
name = "nio-mask-runtime"
version = "0.1.0"
edition = "2021"
description = "High-performance native Rust runtime for NioMask (~1.0M Secret & PII Stream Redactor)"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"

[[bin]]
name = "nio-mask-cli"
path = "src/main.rs"
