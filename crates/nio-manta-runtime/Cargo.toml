[package]
name = "nio-manta-runtime"
version = "0.2.8"
edition = "2021"
description = "Official native conversational companion & planning runtime for NioManta (Qwen2.5-0.5B v-µLM Vector)"
license = "BUSL-1.1"

[dependencies]
candle-core = "=0.8.4"
memmap2 = "0.9"
half = "2.4"
byteorder = "1.5"
rayon = "1.8"
anyhow = "1.0"
tokenizers = { version = "=0.21.4", default-features = false, features = ["onig"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
