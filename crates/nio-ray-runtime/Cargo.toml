[package]
name = "nio-ray-runtime"
version = "0.1.0"
edition = "2021"
description = "Official high-performance native Rust streaming & AST-constrained reflex runtime for NioRay AST-µLM"
license = "BUSL-1.1"

[dependencies]
candle-core = "=0.8.4"
candle-transformers = "=0.8.4"
candle-nn = "=0.8.4"
tokenizers = { version = "=0.21.4", default-features = false, features = ["onig"] }
anyhow = "1.0"
memmap2 = "0.9"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
