[package]
name = "nio-mini-runtime"
version = "0.1.0"
edition = "2021"
description = "High-performance native Rust runtime for NioMini (7.1M Pre-emptive Defect Forecaster)"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"

[[bin]]
name = "nio-mini-cli"
path = "src/main.rs"
