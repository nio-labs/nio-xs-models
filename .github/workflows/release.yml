name: Mirror & Publish NioXS Models Release

on:
  push:
    tags:
      - 'v0.4.0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-bison:
    name: Mirror Bison (7.0B MoE) to GitHub Release v0.4.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stream & Verify Bison (7.0B MoE) from Hugging Face and Split into <2GiB Parts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          echo "1. Downloading bison-tokenizer.json (11.4 MB)..."
          curl -fSL --retry 5 --retry-delay 3 \
            "https://huggingface.co/monynith/nio-bison-7b-gguf/resolve/main/bison-tokenizer.json" \
            -o dist/bison-tokenizer.json
          echo "9fae067af7b47d39e05501d5463a15e83a8fbc62a857f2c2dc58482b8cae8034  dist/bison-tokenizer.json" | sha256sum -c -

          echo "2. Streaming bison.moe-7b-q4km.gguf (2.94 GiB) into 1.9 GB GitHub Release parts..."
          curl -fSL --retry 5 --retry-delay 5 \
            "https://huggingface.co/monynith/nio-bison-7b-gguf/resolve/main/bison.moe-7b-q4km.gguf" \
            | tee >(sha256sum > /tmp/bison.sha256) \
            | split -d -a 2 -b 1900000000 - dist/bison.moe-7b-q4km.gguf.part-
          sync

          COMPUTED_SHA=$(awk '{print $1}' /tmp/bison.sha256)
          EXPECTED_SHA="a96f619fb8a19a975fefccc6e5750b5570b2d77efa1cdacfebfd596f85c49931"
          echo "Computed SHA-256: $COMPUTED_SHA"
          if [ "$COMPUTED_SHA" != "$EXPECTED_SHA" ]; then
            echo "SHA-256 mismatch! Expected $EXPECTED_SHA, got $COMPUTED_SHA"
            exit 1
          fi

          ls -lh dist/

      - name: Publish GitHub Release v0.4.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.0
          name: "v0.4.0 — Bison (7.0B MoE) Sovereign Pure-Code Land Titan Release"
          body: |
            Official **v0.4.0** release distributing **Bison (7.0B MoE)** (`bison.moe-7b-q4km.gguf`, 48-Layer 16-Expert Sparse MoE Pure-Code Land Titan) and `bison-tokenizer.json`.

            - **Assembled GGUF Size**: `3,153,630,976` bytes (`2.94 GiB`)
            - **Assembled GGUF SHA-256**: `a96f619fb8a19a975fefccc6e5750b5570b2d77efa1cdacfebfd596f85c49931`
            - **Tokenizer Size**: `11,422,184` bytes (`10.89 MiB`)
            - **Tokenizer SHA-256**: `9fae067af7b47d39e05501d5463a15e83a8fbc62a857f2c2dc58482b8cae8034`
            - **Pull via NioXS (`v0.5.5+`)**: `nioxs pull bison`
            - **Hugging Face Single-File Mirror**: https://huggingface.co/monynith/nio-bison-7b-gguf
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
