name: Mirror & Publish NioXS Models Release

on:
  push:
    tags:
      - 'v0.4.0'
      - 'v0.4.1'
      - 'v0.4.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-land-fleet:
    name: Mirror Sovereign Land Fleet (Cheetah 1.5B, Tiger 3.0B, Fox 3.0B & Rabbit 3.0B) to GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stream, Verify, and Package Land Fleet Models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          echo "============================================="
          echo "1. Cheetah 1.5B Code Sprinter"
          echo "============================================="
          echo "Downloading cheetah-tokenizer.json (7.0 MB)..."
          curl -fSL --retry 5 --retry-delay 3 \
            "https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct/resolve/main/tokenizer.json" \
            -o dist/cheetah-tokenizer.json
          echo "c0382117ea329cdf097041132f6d735924b697924d6f6fc3945713e96ce87539  dist/cheetah-tokenizer.json" | sha256sum -c -

          echo "Downloading cheetah.1.5b-q4km.gguf (1.11 GB)..."
          curl -fSL --retry 5 --retry-delay 3 \
            "https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf" \
            -o dist/cheetah.1.5b-q4km.gguf
          echo "cc324af070c2ecbfd324a30884d2f951a7ff756aba85cb811a6ec436933bb046  dist/cheetah.1.5b-q4km.gguf" | sha256sum -c -

          echo "============================================="
          echo "2. Tiger / Fox / Rabbit 3.0B Sovereign Workhorse"
          echo "============================================="
          echo "Downloading tiger-tokenizer.json (7.0 MB)..."
          curl -fSL --retry 5 --retry-delay 3 \
            "https://huggingface.co/Qwen/Qwen2.5-Coder-3B-Instruct/resolve/main/tokenizer.json" \
            -o dist/tiger-tokenizer.json
          echo "c0382117ea329cdf097041132f6d735924b697924d6f6fc3945713e96ce87539  dist/tiger-tokenizer.json" | sha256sum -c -

          # Provide tokenizer aliases for Fox and Rabbit
          cp dist/tiger-tokenizer.json dist/fox-tokenizer.json
          cp dist/tiger-tokenizer.json dist/rabbit-tokenizer.json

          echo "Streaming tiger.3b-q4km.gguf (2.10 GB) into 1.9 GB GitHub Release parts..."
          curl -fSL --retry 5 --retry-delay 5 \
            "https://huggingface.co/Qwen/Qwen2.5-Coder-3B-Instruct-GGUF/resolve/main/qwen2.5-coder-3b-instruct-q4_k_m.gguf" \
            | tee >(sha256sum > /tmp/tiger.sha256) \
            | split -d -a 2 -b 1900000000 - dist/tiger.3b-q4km.gguf.part-
          sync

          TIGER_COMPUTED_SHA=$(awk '{print $1}' /tmp/tiger.sha256)
          TIGER_EXPECTED_SHA="724fb256bec1ff062b2f65e4569e871ad2e95ab2a3989723d1769c54294730b7"
          echo "Tiger Computed SHA-256: $TIGER_COMPUTED_SHA"
          if [ "$TIGER_COMPUTED_SHA" != "$TIGER_EXPECTED_SHA" ]; then
            echo "SHA-256 mismatch! Expected $TIGER_EXPECTED_SHA, got $TIGER_COMPUTED_SHA"
            exit 1
          fi

          echo "============================================="
          echo "Package verification complete:"
          ls -lh dist/
          echo "============================================="

      - name: Clean up legacy Bison release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for asset in "bison-tokenizer.json" "bison.moe-7b-q4km.gguf.part-00" "bison.moe-7b-q4km.gguf.part-01" "bison.moe-7b-q4km.gguf.part-02"; do
            echo "Removing $asset if present..."
            gh release delete-asset "${{ github.ref_name }}" "$asset" -y --repo "${{ github.repository }}" || true
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ github.ref_name }} — Sovereign Land Fleet (Cheetah, Tiger, Fox & Rabbit)"
          body: |
            Official release distributing the **Sovereign Land Fleet (`nio-terra`)**:

            ### 🐆 Cheetah (1.5B Q4_K_M) — Sub-20ms Code Sprinter
            - **Binary**: `cheetah.1.5b-q4km.gguf`
            - **Size**: `1,117,320,768` bytes (`1.04 GiB` / `1.11 GB`)
            - **SHA-256**: `cc324af070c2ecbfd324a30884d2f951a7ff756aba85cb811a6ec436933bb046`
            - **Tokenizer**: `cheetah-tokenizer.json` (`c0382117ea329cdf097041132f6d735924b697924d6f6fc3945713e96ce87539`)
            - **Peak RAM**: `< 460 MB` (4-Layer Rolling Window KV)
            - **Active Decode**: `11.22 tok/s` on CPU with Speculative Decoding
            - **Pull Command**: `nioxs pull cheetah`

            ---

            ### 🐅 Tiger (3.0B Q4_K_M) — Sovereign Daily Vibe Coder & Systems Workhorse
            - **Binary**: `tiger.3b-q4km.gguf` (Distributed in 1.9 GB parts: `.part-00`, `.part-01`)
            - **Assembled Size**: `2,104,932,800` bytes (`1.96 GiB` / `2.10 GB`)
            - **SHA-256**: `724fb256bec1ff062b2f65e4569e871ad2e95ab2a3989723d1769c54294730b7`
            - **Tokenizer**: `tiger-tokenizer.json` (`c0382117ea329cdf097041132f6d735924b697924d6f6fc3945713e96ce87539`)
            - **Peak RAM**: `< 720 MB` (`698 MB` measured on CPU)
            - **Active Decode**: `8.5–10.0 tok/s` on CPU with Zero Conversational Fluff
            - **Pull Command**: `nioxs pull tiger`

            ---

            ### 🦊 Fox (3.0B Q4_K_M) — Sovereign Articulate Mentor, Rubber Duck & Pair Programmer
            - **Binary**: `tiger.3b-q4km.gguf` (Shares Tiger 3.0B weights)
            - **Tokenizer**: `fox-tokenizer.json` / `tiger-tokenizer.json`
            - **Peak RAM**: `< 720 MB`
            - **Specialization**: Architecture discussions, trade-off analysis, interactive pedagogy
            - **Pull Command**: `nioxs pull fox`

            ---

            ### 🐇 Rabbit (3.0B Q4_K_M) — Sovereign Deep Thinker & Root-Cause Detective
            - **Binary**: `tiger.3b-q4km.gguf` (Shares Tiger 3.0B weights)
            - **Tokenizer**: `rabbit-tokenizer.json` / `tiger-tokenizer.json`
            - **Peak RAM**: `< 720 MB`
            - **Specialization**: `<think>` Chain-of-Thought reasoning, concurrency deadlocks, memory leaks
            - **Pull Command**: `nioxs pull rabbit`
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
